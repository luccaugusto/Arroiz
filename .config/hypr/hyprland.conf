permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
exec-once = hyprpm reload -n
exec-once = hypridle

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=hyprland
exec-once = sleep 1 && setup_workspace #monitor config
exec-once = startup_progs
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPR_PLUGIN_DIR,/home/lucca/.config/hypr/plugins

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 10
    gaps_out = 20

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(7a0e6aee) rgba(541140ee) 45deg

    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

	layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

	# bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, default
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 3, default
    animation = borderangle, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = false
	force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

debug {
	disable_logs = false
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,br
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
	float_switch_override_focus=1

    sensitivity = 0.3 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
		disable_while_typing = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

scrolling {
	fullscreen_on_one_column = 1
	column_width = 0.7
	focus_fit_method = 1 # 0 centers the focused window, 1 fits
	follow_min_visible = 0.1
}

plugin {
    hyprbars {
        enabled = true
        bar_height = 25
		bar_text_size = 12
        bar_color = rgb(282828)
        bar_blur = 1
		bar_part_of_window = 1
		bar_precedence_over_border = 1

		hyprbars-button = rgb(af4040), 15, 󰖭, hyprctl dispatch killactive
		hyprbars-button = rgb(9fc5e8), 15, , hyprctl dispatch togglefloating && hyprctl dispatch pin
		hyprbars-button = rgb(ffd966), 15, , hyprctl dispatch fullscreen 1
    }

	hyprmodoro {
		enabled = true
		work_duration = 50
		rest_duration = 10
		auto_transition = true
		title {
			all_windows = false
			position = bottom
			overlay = true
		}
		border {
			enabled = true
			color = rgba(0, 207, 76, 0.58)
		}
		text {
			work_prefix =  .
			skip_on_click = true
		}
		hover {
			text = true
			height = 0.01
		}
		sound {
			player = pw-play
			work_end = /home/lucca/.local/sounds/arcade-ui-4.mp3
			rest_end = /home/lucca/.local/sounds/arcade-ui-2.mp3
		}
		notification {
			enabled = true
			use_system_notifications = true
		}
	}
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, RETURN, exec, $TERMINAL
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod SHIFT, S, exec, powermenu
bind = $mod, F, exec, $TERMINAL -e yazi
bind = $mod CTRL, SPACE, togglefloating,
bind = $mod CTRL, RETURN, exec, toggle_sidebar
bind = $mod SHIFT, B, exec, toggle_status_bar
bind = $mod, B, exec, lockscreen
bind = $mod, SPACE, exec, rofi -show drun -show-icons
bind = $mod SHIFT, SPACE, exec, rofi -show run -show-icons
bind = $mod, V, exec, ~/.config/hypr/scripts/window_finder.sh
bind = $mod SHIFT, M, exec, rofi -show calc -modi calc -no-show-match -no-sort -theme ~/.config/rofi/calc.rasi
bind = $mod, W, exec, $BROWSER --disable-features=WaylandWpColorManagerV1

bind = $mod, T, exec, dunstctl set-paused toggle


bind = $mod SHIFT, RETURN, layoutmsg, swapwithmaster
bind = $mod, SEMICOLON, exec, ~/.config/hypr/scripts/toggle_layout.sh
bind = $mod SHIFT, SEMICOLON, exec, ~/.config/hypr/scripts/toggle_layout.sh prev
bind = $mod, M, fullscreen, 1

bind = $mod CTRL, R, exec, hyprctl reload

bind = $mod, F1, exec, sound_control -t
bind = $mod, F2, exec, $TERMINAL --class floats -e pulsemixer
bind = $mod, F10, exec, toggle_redshift
bind = $mod, F11, exec, killall btop || $TERMINAL -e btop

# Minimize by putting in special workspace
# bind = $mod, N, togglespecialworkspace, magic
# bind = $mod, N, movetoworkspace, +0
# bind = $mod, N, togglespecialworkspace, magic
# bind = $mod, N, movetoworkspace, special:magic
# bind = $mod, N, togglespecialworkspace, magic

# Move focus with mod + arrow keys
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, H, swapwindow, l
bind = $mod SHIFT, L, swapwindow, r
bind = $mod SHIFT, K, swapwindow, u
bind = $mod SHIFT, J, swapwindow, d
bind = $mod, C, cyclenext,
bind = $mod, Tab, cyclenext,

# Switch workspaces with mod + [0-9]
bind = $mod, 1, exec, hypr_workspace_manager 1
bind = $mod, 2, exec, hypr_workspace_manager 2
bind = $mod, 3, exec, hypr_workspace_manager 3
bind = $mod, 4, exec, hypr_workspace_manager 4
bind = $mod, 5, exec, hypr_workspace_manager 5
bind = $mod, 6, exec, hypr_workspace_manager 6
bind = $mod, 7, exec, hypr_workspace_manager 7
bind = $mod, 8, exec, hypr_workspace_manager 8
bind = $mod, 9, exec, hypr_workspace_manager 9
bind = $mod, 0, exec, hypr_workspace_manager 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, exec, hypr_workspace_manager move 1
bind = $mod SHIFT, 2, exec, hypr_workspace_manager move 2
bind = $mod SHIFT, 3, exec, hypr_workspace_manager move 3
bind = $mod SHIFT, 4, exec, hypr_workspace_manager move 4
bind = $mod SHIFT, 5, exec, hypr_workspace_manager move 5
bind = $mod SHIFT, 6, exec, hypr_workspace_manager move 6
bind = $mod SHIFT, 7, exec, hypr_workspace_manager move 7
bind = $mod SHIFT, 8, exec, hypr_workspace_manager move 8
bind = $mod SHIFT, 9, exec, hypr_workspace_manager move 9
bind = $mod SHIFT, 0, exec, hypr_workspace_manager move 10

bind = $mod, O, exec, hypr_workspace_manager other

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod, N, movetoworkspace, special:magic
bind = $mod, N, togglespecialworkspace, magic

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = ,Print, exec, screenshot

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, sound_control u
bindel = ,XF86AudioLowerVolume, exec, sound_control d
bindel = ,XF86AudioMute, exec, sound_control m

# mic mute is useless for me set it to toggle the default audio source
bindel = ,XF86AudioMicMute, exec, sound_control t
bindel = ,XF86Launch1, exec, sound_control t

bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bind = $mod ALT, +, exec, brightnessctl s 5%+

bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = $mod ALT, -, exec, brightnessctl s 5%+

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bind = $mod ALT, period, exec, playerctl next

bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bind = $mod ALT, P, exec, playerctl play-pause

bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mod ALT, comma, exec, playerctl previous

# Clipboard manager
bind = $mod SHIFT, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy


##############################
###        SWITCHES        ###
##############################
# Trigger when the switch is toggled.
bindl = , switch:on:Lid Switch, exec, lockscreen
# Trigger when the switch is turning on.
bindl = , switch:on:Lid Switch, exec, systemctl suspend
# Trigger when the switch is turning off.
bindl = , switch:off:Lid Switch, exec, setup_workspace


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule = float on, match:class .*Floating.*
windowrule = float on, match:class .*floats.*
windowrule = float on, match:initial_class .*zoom.*
windowrule = size 35% 60%, match:class .*floats.*
windowrule = move (20) (100), match:class .*Tasklist.*
windowrule = float on, match:initial_class .*Tasklist.*
windowrule = size 35% 60%, match:initial_class .*Tasklist.*

windowrule = float on, match:class .*Authenticator.*
windowrule = size 35% 60%, match:class .*Authenticator.*
windowrule = move (20) (100), match:initial_class .*io.ente.auth.*
windowrule = float on, match:initial_class .*io.ente.auth.*
windowrule = size 35% 60%, match:initial_class .*io.ente.auth.*
windowrule = size 60% 35%, match:initial_title .*pulsemixer.*

windowrule = float on, match:initial_class .*blueman-manager.*
windowrule = size 15% 15%, match:initial_class .*blueman-manager.*


windowrule = pin on, match:class (Rofi)

windowrule = float on, match:title ^(flameshot)
windowrule = move 0 0, match:title ^(flameshot)
windowrule = suppress_event fullscreen, match:title ^(flameshot)

windowrule = workspace 2, match:initial_class .*firefox.*
windowrule = workspace 2, match:initial_class .*Vivaldi.*
windowrule = workspace 2, match:initial_class .*brave.*
windowrule = workspace 2, match:initial_class .*qutebrowser.*

windowrule = workspace 3 silent, match:initial_class .*Gimp.*
# windowrule = workspace 3 silent, match:initial_class .*krita.*
# windowrule = workspace 3 silent, match:initial_class .*shotcut.*

windowrule = workspace 4 silent, match:initial_class .*Telegram.*
windowrule = workspace 4 silent, match:initial_class .*Ferdium.*
windowrule = workspace 4 silent, match:initial_class .*[Tt]hunderbird.*

windowrule = workspace 5 silent, match:initial_class .*zoom.*

windowrule = workspace 6 silent, match:initial_class .*discord.*
windowrule = workspace 6 silent, match:initial_class .*slack.*
windowrule = workspace 6 silent, match:initial_class .*Slack.*

windowrule = workspace 8 silent, match:initial_class .*transmission.*

windowrule = workspace 9, match:initial_class .*DBeaver.*

windowrule = workspace 10, match:initial_class .*Spotify.*
windowrule = workspace 10, match:initial_class .*spotify.*
windowrule = workspace 10, match:initial_class .*elisa.*
windowrule = workspace 10 silent, match:initial_class .*org.gnome.clocks.*


windowrule = suppress_event maximize, match:class .*


monitor=eDP-1,1920x1200@120.00,0x0,1.00
monitor=DP-1,1920x1080@60.00,1920x0,1.00
monitor=DP-2,1920x1080@60.00,3840x0,1.00